# Override any subset of the dataclass defaults in src/balltrack/config.py.
data:
  video: data/received/part1.mp4    # matches your data/received/ layout
  labels: data/received/part1.csv
  out_dir: data/yolo                # generated by prepare_dataset.py
  subsample: 6          # EDA: dense data -> keep every 6th frame
  box_size: 24          # point -> ~ball-sized box
  crop_size: 640        # native-resolution crops -> ball never shrinks
  hard_negative_ratio: 0.25
  val_fraction: 0.2     # temporal hold-out (NOT random)
  split_buffer: 300

train:
  model: yolo26n.pt
  imgsz: 640
  epochs: 75
  batch: 16             # fits a 6GB RTX 2060
  device: 0

track:
  roi_size: 640
  reacquire_imgsz: 1920
  max_jump: 40.0        # EDA: p99 ~16 px/frame -> gate well above
  max_coast: 8
  conf: 0.25