# Override any subset of the dataclass defaults in src/balltrack/config.py.
data:
  video: data/received/part1.mp4   
  labels: data/received/part1.csv
  out_dir: data/yolo                
  subsample: 6       
  box_size: 22         
  crop_size: 640       
  hard_negative_ratio: 0.25
  val_fraction: 0.2     
  split_buffer: 300

train:
  model: yolo26n.pt
  imgsz: 640
  epochs: 75
  batch: 16             
  device: 0

track:
  reacquire_imgsz: 1920
  max_jump: 40.0       
  max_coast: 8
  conf: 0.25

mlflow:
  experiment: balltrack   # server URI is env-driven: MLFLOW_TRACKING_URI
                          # (default http://127.0.0.1:5000)